name: Heavy Lux Engine Test

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "package.json"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run engine smoke test
        run: node src/test-engine.js
