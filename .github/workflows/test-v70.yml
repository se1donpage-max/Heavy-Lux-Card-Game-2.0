
name: K7 CREW V7.0 Test Installation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v70:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/v70-testing'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: v70-testing

      - name: Verify archive
        run: |
          echo "500f75534d65ba8f52b93185200215416b9fde413d5ab9662ae13d47a2605cd2  K7_V70_CONNECTED_COMMUNITY_RC.zip" | sha256sum -c -
          unzip -t K7_V70_CONNECTED_COMMUNITY_RC.zip

      - name: Verify baseline
        run: |
          unzip -p K7_V70_CONNECTED_COMMUNITY_RC.zip docs/V70_BASELINE_SHA.json > /tmp/baseline.json
          python3 - <<'PY'
          import json
          import subprocess
          with open("/tmp/baseline.json") as f:
              baseline = json.load(f)
          for path, expected in baseline.items():
              actual = subprocess.check_output(
                  ["git", "hash-object", path],
                  text=True
              ).strip()
              if actual != expected:
                  raise SystemExit("Baseline mismatch: " + path)
          PY

      - name: Install V7.0
        run: unzip -o K7_V70_CONNECTED_COMMUNITY_RC.zip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate V7.0
        run: |
          npm run check:encoding
          npm run check:assets
          npm run test:local
          node scripts/test-v7.cjs
          npm run typecheck
          npm run build

      - name: Save V7.0 test version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          unzip -Z1 K7_V70_CONNECTED_COMMUNITY_RC.zip | while IFS= read -r file; do
            git add -- "$file"
          done
          git rm K7_V70_CONNECTED_COMMUNITY_RC.zip
          git commit -m "K7 CREW V7.0 CONNECTED COMMUNITY RC"
          git push origin HEAD:v70-testing
