
name: Apply K7 CREW V7.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working version
        uses: actions/checkout@v4
        with:
          ref: v70-testing

      - name: Apply V7.1 archive
        run: |
          unzip -o K7_V71_REFINEMENT.zip
          git diff --stat

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check encoding
        run: npm run check:encoding

      - name: Check assets
        run: npm run check:assets

      - name: TypeScript validation
        run: npm run typecheck

      - name: Local tests
        run: npm run test:local

      - name: Save V7.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib public scripts docs
          git commit -m "K7 CREW V7.1 DARK ELITE REFINEMENT"
          git push origin HEAD:v70-testing
