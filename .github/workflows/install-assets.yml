name: Install K7 CREW Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract PNG assets
        run: |
          echo "926a381ee9375541dfae372908fd25ede251069778bc42d7a335670af3140bba  K7_V6_363_PNG.zip" | sha256sum -c -
          unzip -t K7_V6_363_PNG.zip
          unzip -o K7_V6_363_PNG.zip
          COUNT=$(find public/k7-ui -type f -name '*.png' | wc -l)
          echo "PNG files: $COUNT"
          test "$COUNT" -eq 363

      - name: Validate assets
        run: node scripts/check-assets.mjs

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/k7-ui
          git rm K7_V6_363_PNG.zip
          git commit -m "Install 363 K7 CREW graphic assets"
          git push origin main
